name: npm update

# An explicit run title. Without one GitHub derives an event-specific
# default, and some surfaces (the GitHub mobile app's run header, seen on
# this workflow's first scheduled run) headline the run with the
# tip-of-main commit message instead — the weekly batch masquerading as
# whatever unrelated commit main pointed at when the cron fired.
run-name: Update npm dependencies

# The thin caller for mikelward/npm-update's reusable workflow — see that
# repo's README.md for the wiring contract. This repo owns the schedule and
# the manual trigger, and grants the permissions the reusable workflow's jobs
# need (its own top-level permissions are empty by design; each job declares
# only what it needs, capped by what's granted here).
#
# regenerate/regenerated-files keep supabase/functions/import_map.json in
# sync with package-lock.json: the Edge runtime resolves the import map, not
# package.json, and import_map.test.ts (run by the dispatched ci.yml) fails
# when the two disagree. The Renovate custom manager that used to do this
# went away with the rest of the config (AGENTS.md "Dependency updates") —
# without this hook every bump of a mapped package would open a PR that's
# red on arrival.

on:
  schedule:
    # 06:17 UTC on Saturdays. Actions cron is best-effort and can be delayed by
    # tens of minutes under load, which is fine for a weekly chore — and the
    # off-the-hour minute is deliberate, since the top of the hour is the most
    # congested slot on the shared scheduler and the most likely to be delayed.
    - cron: '17 6 * * 6'
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-update
  cancel-in-progress: false

jobs:
  npm-update:
    uses: mikelward/npm-update/.github/workflows/npm-update.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      regenerate: npm run import-map:sync
      regenerated-files: supabase/functions/import_map.json
