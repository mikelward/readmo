# Advisory scan of the workflows with zizmor (https://docs.zizmor.sh).
#
# Advisory MEANS advisory: nothing requires this check, on purpose. Running
# it fetches zizmor from PyPI, and a registry outage must not stall the merge
# gate. A red run here is a finding to read, not a gate — ported from
# mikelward/codex-review, which runs the same scan on itself.
#
# There is no `paths:` filter, even though the job is still advisory: making
# it required is TODO.md's "Make `zizmor` a required check" item, and a
# workflow filtered by paths creates NO check run at all on a non-matching
# pull request (unlike a skipped job, which reports "skipped" and satisfies
# a ruleset) -- so a required `zizmor` plus a path filter would leave any
# pull request not touching `.github/**` waiting forever on a check nothing
# reports. Widening the trigger now, ahead of the ruleset change, means the
# job is already unfiltered by the time that item is actioned. The scan is
# a free sub-minute job, so it simply runs on every pull request and every
# push to main.
#
# The version is pinned because a new zizmor release adds audits, so an
# unpinned run could turn red with no change in this repository. Bump it
# deliberately and re-read the findings. Policy exceptions live in
# .github/zizmor.yml, beside this file.
#
# Cost and reliability: PyPI is free, keyless, and unmetered, so this is
# $0/month at any run volume. A cold pipx install-and-scan typically finishes
# in well under a minute; the 5-minute timeout is headroom for a slow PyPI
# resolve, not the expected case. The only new failure mode is a PyPI outage,
# and it fails only this advisory job -- it cannot block a merge, since
# nothing requires this check.
#
# `pull_request` lists its types explicitly because the default set lacks
# `edited`: a retarget regenerates the merge ref against the new base while
# the head -- and the green `zizmor` run already attached to it -- stays
# put, so without `edited` the old target's scan would satisfy the new one
# unexamined. Title and body edits re-run the scan too; redundant but cheap.
name: zizmor
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # --offline, so the scan talks to nothing: the audits that need the
      # GitHub API are skipped, deterministically, and the only fetch is
      # zizmor itself.
      - name: Scan the workflows
        run: pipx run --spec zizmor==1.29.0 zizmor --no-progress --offline .
