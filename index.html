<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="description" content="A mobile-friendly, installable reader for your RSS, Atom, and JSON feeds." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="readmo" />
    <title>readmo</title>
    <script>
      // Boot guard: recover from a blank first load after a deploy. The service
      // worker can briefly hand a stale index.html that references the previous
      // build's content-hashed entry (/assets/index-<oldhash>.js); that file is
      // gone from the current deployment, so the module fails to load and the
      // page paints empty until a manual refresh. Reload once (one-shot, guarded
      // against a loop) to fetch the current index.html + hashes. Must run before
      // the entry <script> so it can catch that entry failing — which is why this
      // is inline here rather than in a module. Uses its own one-shot budget
      // (readmo:entry-reload, mirrors ENTRY_RELOAD_GUARD_KEY in
      // src/lib/chunkReload.ts) which main.tsx clears on a successful boot, so a
      // second stale entry later in the session auto-reloads again.
      //
      // Once the app has booted (window.__readmoBooted, set by main.tsx when it
      // clears the entry budget) this guard stands down: post-boot /assets/
      // failures (a lazy route's chunk or CSS 404ing) belong to the CHUNK budget
      // in chunkReload.ts, which fails closed. Without this check a persistently
      // failing post-boot asset would loop forever — every boot clears the entry
      // budget, so every failure would spend it again and reload.
      (function () {
        var KEY = 'readmo:entry-reload';
        window.addEventListener(
          'error',
          function (event) {
            if (window.__readmoBooted) return;
            var el = event && event.target;
            if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
            if (!/\/assets\//.test(el.src || el.href || '')) return;
            try {
              if (sessionStorage.getItem(KEY) !== null) return;
              sessionStorage.setItem(KEY, '1');
            } catch (e) {
              return;
            }
            location.reload();
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
